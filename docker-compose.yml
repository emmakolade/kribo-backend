version: '3.9'
services:
  api:
    build: .
    container_name: kribo-api
    ports:
      - '4000:4000'
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
      - rabbitmq
  mongo:
    image: mongo:7
    container_name: kribo-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
  redis:
    image: redis:7
    container_name: kribo-redis
    ports:
      - '6379:6379'
  rabbitmq:
    image: rabbitmq:3-management
    container_name: kribo-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
volumes:
  mongo_data:
